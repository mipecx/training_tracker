<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTracker</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">GYMTRACKER</div>
    <div class="day-badge" id="hdr-date"></div>
  </div>

  <div id="screen-home" class="screen active">
    <div id="home-body"></div>
  </div>

  <div id="screen-workout" class="screen">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
      <div class="progress-txt" id="prog-txt"></div>
    </div>
    <div id="ex-wrap"></div>
    <div class="action-row" style="margin-top:8px">
      <button class="btn btn-sm" onclick="skipEx()">Skip</button>
      <button class="btn btn-accent" style="flex:1" onclick="doneSet()">Done → Rest</button>
    </div>
  </div>

  <div id="screen-rest" class="screen">
    <div class="rest-wrap">
      <div class="rest-lbl">Rest</div>
      <div class="arc-wrap">
        <svg class="arc-svg" viewBox="0 0 180 180">
          <circle class="arc-bg" cx="90" cy="90" r="78"/>
          <circle class="arc-fill" id="arc-fill" cx="90" cy="90" r="78"/>
        </svg>
        <div class="arc-center">
          <div class="rest-time" id="rest-time">0:00</div>
        </div>
      </div>
      <div class="rest-next" id="rest-next"></div>
      <div class="rest-actions">
        <button class="btn btn-sm" onclick="adjRest(30)">+30s</button>
        <button class="btn btn-accent" style="flex:1" onclick="skipRest()">Next →</button>
        <button class="btn btn-sm" onclick="adjRest(-15)">−15s</button>
      </div>
    </div>
  </div>

  <div id="screen-finish" class="screen">
    <div id="finish-body"></div>
    <button class="btn btn-accent" onclick="goHome()" style="margin-top:8px">← Home</button>
  </div>

  <div id="screen-history" class="screen">
    <div id="history-body"></div>
  </div>

  <div id="screen-session" class="screen">
    <div id="session-body"></div>
  </div>

  <div id="screen-progress" class="screen">
    <div class="prog-header">
      <div class="prog-tabs">
        <button class="prog-tab active" onclick="switchProgTab('metrics')" id="tab-metrics">Metrics</button>
        <button class="prog-tab" onclick="switchProgTab('history')" id="tab-history-p">History</button>
      </div>
    </div>
    <div id="prog-metrics" class="prog-panel">
      <div id="metrics-form-wrap"></div>
      <div id="metrics-history-wrap"></div>
    </div>
    <div id="prog-history-p" class="prog-panel" style="display:none">
      <div id="metrics-chart-wrap"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="navTo('home')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      <span>Today</span>
    </button>
    <button class="nav-btn" id="nav-history" onclick="navTo('history')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>History</span>
    </button>
    <button class="nav-btn" id="nav-progress" onclick="navTo('progress')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Metrics</span>
    </button>
  </nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
